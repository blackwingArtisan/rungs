[package]
name = "rungs"
description = "Rungs: earned-trust bounties on NEAR with Sputnik DAO escalation"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
resolver = "3"
repository = "https://github.com/blackwingArtisan/rungs"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
